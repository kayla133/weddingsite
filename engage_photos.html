            1. Put your photos in images/engagement/

    <dialog class="lightbox" id="engagement-lightbox" aria-label="Engagement photo viewer">
        <div class="lightbox-toolbar">
            <p class="lightbox-counter" id="lightbox-counter" aria-live="polite"></p>
            <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close photo viewer">Close</button>
        </div>
        <div class="lightbox-content">
            <button class="lightbox-arrow" id="lightbox-previous" type="button" aria-label="Previous photo">&larr;</button>
            <figure>
                <img id="lightbox-image" alt="">
            </figure>
            <button class="lightbox-arrow" id="lightbox-next" type="button" aria-label="Next photo">&rarr;</button>
        </div>
    </dialog>
